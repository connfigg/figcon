<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Con Fig ‑ Neural Core Panel</title>
  <style>
    :root {
      --bg-main: #050a14;
      --bg‑glow: #0b1b30;
      --cyber‑primary: #00e5ff;
      --cyber‑accent: #2979ff;
      --cyber‑dim: #42a5f5;
      --cyber‑glow: rgba(0, 229, 255, 0.35);
      --border‑soft: rgba(0, 229, 255, 0.22);
      --text‑light: #e8f4ff;
      --text‑muted: #89a2bc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'JetBrains Mono', 'Inter', 'Segoe UI', Roboto, monospace;
    }

    body {
      background: radial-gradient(ellipse at 50% 0%, var(--bg‑glow), var(--bg-main));
      color: var(--text‑light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .ai‑badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(0, 229, 255, 0.10);
      border: 1px solid var(--border‑soft);
      padding: 0.35rem 0.85rem;
      border-radius: 6px;
      font-size: 0.8rem;
      color: var(--cyber‑dim);
      margin-bottom: 0.75rem;
      box-shadow: 0 0 14px var(--cyber‑glow);
    }

    .ai‑badge span {
      width: 8px;
      height: 8px;
      background: var(--cyber‑primary);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--cyber‑primary);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.92); opacity: 0.75; }
      50% { transform: scale(1.25); opacity: 1; box-shadow: 0 0 16px var(--cyber‑primary); }
      100% { transform: scale(0.92); opacity: 0.75; }
    }

    header h1 {
      font-size: 2.5rem;
      background: linear-gradient(135deg, #ffffff, var(--cyber‑dim), var(--cyber‑primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
      letter-spacing: 1px;
    }

    header p {
      color: var(--text‑muted);
      font-size: 0.95rem;
      margin-top: 0.3rem;
    }

    .config‑control {
      width: 100%;
      max-width: 1100px;
      background: rgba(0, 229, 255, 0.04);
      border: 1px solid var(--border‑soft);
      backdrop-filter: blur(14px);
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.55);
    }

    .config‑control label {
      font-size: 0.85rem;
      color: var(--cyber‑dim);
      font-weight: 600;
    }

    .config‑control input {
      width: 100%;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(0, 229, 255, 0.40);
      border-radius: 6px;
      padding: 0.75rem 1rem;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border‑color 0.22s, box‑shadow 0.22s;
    }

    .config‑control input:focus {
      border‑color: var(--cyber‑primary);
      box-shadow: 0 0 12px var(--cyber‑glow);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto‑fit, minmax(320px, 1fr));
      gap: 1.5rem;
      width: 100%;
      max-width: 1100px;
    }

    .card {
      background: rgba(0, 229, 255, 0.04);
      border: 1px solid var(--border‑soft);
      backdrop-filter: blur(14px);
      border-radius: 8px;
      padding: 1.5rem;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.40);
      transition: all 0.3s cubic‑bezier(0.4, 0, 0.2, 1);
    }

    .card:hover {
      transform: translateY(-3px);
      border‑color: var(--cyber‑primary);
      box-shadow: 0 12px 36px rgba(0, 229, 255, 0.18);
    }

    .card‑header {
      display: flex;
      justify-content: space‑between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .badge {
      background: rgba(0, 229, 255, 0.11);
      color: var(--cyber‑dim);
      padding: 0.25rem 0.65rem;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      border: 1px solid rgba(0, 229, 255, 0.24);
    }

    .card h2 {
      font-size: 1.15rem;
      color: #ffffff;
      font-weight: 700;
    }

    .code‑box {
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(0, 229, 255, 0.12);
      border-radius: 6px;
      padding: 0.85rem;
      font-family: monospace;
      font-size: 0.78rem;
      color: var(--cyber‑dim);
      word‑break: break‑all;
      margin-bottom: 1rem;
      max-height: 90px;
      overflow‑y: auto;
      line-height: 1.4;
    }

    .btn‑group {
      display: flex;
      gap: 0.5rem;
    }

    .btn {
      flex: 1;
      padding: 0.65rem;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.22s ease;
      font-size: 0.85rem;
    }

    .btn‑copy {
      background: linear-gradient(135deg, #00e5ff, #2979ff);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(0, 229, 255, 0.32);
    }

    .btn‑copy:hover {
      opacity: 0.92;
      box-shadow: 0 6px 20px rgba(0, 229, 255, 0.50);
    }

    footer {
      margin-top: auto;
      padding-top: 3rem;
      color: var(--text‑muted);
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div class="ai‑badge">
      <span></span> Con Fig Neural Core Active
    </div>
    <h1>Con Fig Panel</h1>
    <p>Dynamic Secure Tunnel Endpoints</p>
  </header>

  <div class="config‑control">
    <label for="dynamicHost">Dynamic Host / Server Domain:</label>
    <input type="text" id="dynamicHost" value="" oninput="updateConfigs()" placeholder="Detecting clean host…" />
  </div>

  <main class="grid">
    <div class="card">
      <div class="card‑header">
        <h2>Trojan</h2>
        <span class="badge">WebSocket</span>
      </div>
      <div class="code‑box" id="box‑trojan‑ws"></div>
      <div class="btn‑group">
        <button class="btn btn‑copy" onclick="copyConfig('box‑trojan‑ws')">Copy Config</button>
      </div>
    </div>

    <div class="card">
      <div class="card‑header">
        <h2>Trojan</h2>
        <span class="badge">HTTP Upgrade</span>
      </div>
      <div class="code‑box" id="box‑trojan‑hu"></div>
      <div class="btn‑group">
        <button class="btn btn‑copy" onclick="copyConfig('box‑trojan‑hu')">Copy Config</button>
      </div>
    </div>

    <div class="card">
      <div class="card‑header">
        <h2>VLESS</h2>
        <span class="badge">WebSocket</span>
      </div>
      <div class="code‑box" id="box‑vless‑ws"></div>
      <div class="btn‑group">
        <button class="btn btn‑copy" onclick="copyConfig('box‑vless‑ws')">Copy Config</button>
      </div>
    </div>

    <div class="card">
      <div class="card‑header">
        <h2>VLESS</h2>
        <span class="badge">HTTP Upgrade</span>
      </div>
      <div class="code‑box" id="box‑vless‑hu"></div>
      <div class="btn‑group">
        <button class="btn btn‑copy" onclick="copyConfig('box‑vless‑hu')">Copy Config</button>
      </div>
    </div>

    <div class="card">
      <div class="card‑header">
        <h2>VMess</h2>
        <span class="badge">WebSocket</span>
      </div>
      <div class="code‑box" id="box‑vmess‑ws"></div>
      <div class="btn‑group">
        <button class="btn btn‑copy" onclick="copyConfig('box‑vmess‑ws')">Copy Config</button>
      </div>
    </div>

    <div class="card">
      <div class="card‑header">
        <h2>VMess</h2>
        <span class="badge">HTTP Upgrade</span>
      </div>
      <div class="code‑box" id="box‑vmess‑hu"></div>
      <div class="btn‑group">
        <button class="btn btn‑copy" onclick="copyConfig('box‑vmess‑hu')">Copy Config</button>
      </div>
    </div>

    <div class="card">
      <div class="card‑header">
        <h2>Shadowsocks</h2>
        <span class="badge">WebSocket</span>
      </div>
      <div class="code‑box" id="box‑ss‑ws"></div>
      <div class="btn‑group">
        <button class="btn btn‑copy" onclick="copyConfig('box‑ss‑ws')">Copy Config</button>
      </div>
    </div>

    <div class="card">
      <div class="card‑header">
        <h2>Shadowsocks</h2>
        <span class="badge">HTTP Upgrade</span>
      </div>
      <div class="code‑box" id="box‑ss‑hu"></div>
      <div class="btn‑group">
        <button class="btn btn‑copy" onclick="copyConfig('box‑ss‑hu')">Copy Config</button>
      </div>
    </div>
  </main>

  <footer>
    &copy; Con Fig System &bull; Neural Robotics Core
  </footer>

  <script>
    const templates = {
      trojanWs: "trojan://gcp-xray@firebaseremoteconfigrealtime.googleapis.com:443?type=ws&host=HOST_PLACEHOLDER&headerType=none&path=%2Ftrojan-ws&security=tls&sni=firebaseremoteconfigrealtime.googleapis.com#GCP-Trojan-WS",
      trojanHu: "trojan://gcp-xray@firebaseremoteconfigrealtime.googleapis.com:443?type=httpupgrade&host=HOST_PLACEHOLDER&headerType=none&path=%2Ftrojan-hu&security=tls&sni=firebaseremoteconfigrealtime.googleapis.com#GCP-Trojan-HU",
      vlessWs: "vless://a1b2c3d4-5678-40ef-98ab-cdef01234567@firebaseremoteconfigrealtime.googleapis.com:443?encryption=none&type=ws&host=HOST_PLACEHOLDER&headerType=none&path=%2Fvless-ws&security=tls&sni=firebaseremoteconfigrealtime.googleapis.com#GCP-VLESS-WS",
      vlessHu: "vless://a1b2c3d4-5678-40ef-98ab-cdef01234567@firebaseremoteconfigrealtime.googleapis.com:443?encryption=none&type=httpupgrade&host=HOST_PLACEHOLDER&headerType=none&path=%2Fvless-hu&security=tls&sni=firebaseremoteconfigrealtime.googleapis.com#GCP-VLESS-HU",
      vmessWs: () => {
        const h = document.getElementById('dynamicHost').value;
        const obj = {"add":"apps.google.com","port":"443","id":"a1b2c3d4-5678-40ef-98ab-cdef01234567","aid":"0","scy":"chacha20-poly1305","net":"ws","type":"none","host":h,"path":"/vmess-ws","tls":"tls","sni":"firebaseremoteconfigrealtime.googleapis.com","ps":"GCP-VMESS-WS","v":"2"};
        return "vmess://" + btoa(JSON.stringify(obj));
      },
      vmessHu: () => {
        const h = document.getElementById('dynamicHost').value;
        const obj = {"add":"apps.google.com","port":"443","id":"a1b2c3d4-5678-40ef-98ab-cdef01234567","aid":"0","scy":"chacha20-poly1305","net":"httpupgrade","type":"none","host":h,"path":"/vmess-hu","tls":"tls","sni":"firebaseremoteconfigrealtime.googleapis.com","ps":"GCP-VMESS-HU","v":"2"};
        return "vmess://" + btoa(JSON.stringify(obj));
      },
      ssWs: "ss://Y2hhY2hhMjAtaWV0Zi1wb2x5MTMwNTp3ZWJtYXN0ZXJnaGllMTg=@apps.google.com:443?type=ws&host=HOST_PLACEHOLDER&headerType=none&path=%2Fss-ws&security=tls&sni=firebaseremoteconfigrealtime.googleapis.com#SHADOWSOCKS-WS",
      ssHu: "ss://Y2hhY2hhMjAtaWV0Zi1wb2x5MTMwNTpnY3AteHJheQ==@apps.google.com:443?type=httpupgrade&host=HOST_PLACEHOLDER&headerType=none&path=%2Fss-hu&security=tls&sni=firebaseremoteconfigrealtime.googleapis.com#SHADOWSOCKS-HU"
    };

    function cleanHost(raw) {
      return raw.replace(/^https?:\/\//, '').replace(/\/$/, '').trim();
    }

    function updateConfigs() {
      let host = cleanHost(document.getElementById('dynamicHost').value);
      document.getElementById('box-trojan-ws').innerText = templates.trojanWs.replace(/HOST_PLACEHOLDER/g, host);
      document.getElementById('box-trojan-hu').innerText = templates.trojanHu.replace(/HOST_PLACEHOLDER/g, host);
      document.getElementById('box-vless-ws').innerText = templates.vlessWs.replace(/HOST_PLACEHOLDER/g, host);
      document.getElementById('box-vless-hu').innerText = templates.vlessHu.replace(/HOST_PLACEHOLDER/g, host);
      document.getElementById('box-vmess-ws').innerText = templates.vmessWs();
      document.getElementById('box-vmess-hu').innerText = templates.vmessHu();
      document.getElementById('box-ss-ws').innerText = templates.ssWs.replace(/HOST_PLACEHOLDER/g, host);
      document.getElementById('box-ss-hu').innerText = templates.ssHu.replace(/HOST_PLACEHOLDER/g, host);
    }

    function copyConfig(elementId) {
      const text = document.getElementById(elementId).innerText;
      navigator.clipboard.writeText(text).then(() => {
        alert('Na‑copy na ang config, idol!');
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      const rawHost = window.location.hostname;
      const finalHost = cleanHost(rawHost);
      document.getElementById('dynamicHost').value = finalHost;
      updateConfigs();
    });
  </script>
</body>
</html>
