worker_processes auto;
events { 
    worker_connections 2048; 
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    set_real_ip_from 0.0.0.0/0;
    real_ip_header X‑Forwarded‑For;
    real_ip_recursive on;

    limit_req_zone $remote_addr zone=req_limit:10m rate=20r/s;
    limit_conn_zone $remote_addr zone=conn_limit:10m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;
        server_name _;

        client_body_timeout 15s;
        client_header_timeout 15s;
        keepalive_timeout 65s;
        send_timeout 15s;

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ =404;
        }

        location ~ ^/(trojan‑ws|trojan‑hu|vless‑ws|vless‑hu|vmess‑ws|vmess‑hu|ss‑ws|ss‑hu) {
            limit_req zone=req_limit burst=40 nodelay;
            limit_conn conn_limit 40;

            proxy_redirect off;
            proxy_buffering off;

            if ($request_uri ~* "^/trojan‑ws") { proxy_pass http://127.0.0.1:10001$request_uri; }
            if ($request_uri ~* "^/trojan‑hu") { proxy_pass http://127.0.0.1:10002$request_uri; }
            if ($request_uri ~* "^/vless‑ws")  { proxy_pass http://127.0.0.1:10003$request_uri; }
            if ($request_uri ~* "^/vless‑hu")  { proxy_pass http://127.0.0.1:10004$request_uri; }
            if ($request_uri ~* "^/vmess‑ws")  { proxy_pass http://127.0.0.1:10005$request_uri; }
            if ($request_uri ~* "^/vmess‑hu")  { proxy_pass http://127.0.0.1:10006$request_uri; }
            if ($request_uri ~* "^/ss‑ws")     { proxy_pass http://127.0.0.1:10007$request_uri; }
            if ($request_uri ~* "^/ss‑hu")     { proxy_pass http://127.0.0.1:10008$request_uri; }

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X‑Real‑IP $remote_addr;
            proxy_set_header X‑Forwarded‑For $proxy_add_x_forwarded_for;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
