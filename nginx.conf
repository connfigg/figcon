user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;
    keepalive_timeout 65;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    gzip on;

    server {
        listen 8080;
        server_name _;

        add_header Content-Type application/json; charset=UTF-8 always;
        add_header Server "Google Frontend" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Cache-Control "no-cache, no-store, max-age=0, must-revalidate" always;
        add_header Expires "Mon, 01 Jan 1990 00:00:00 GMT" always;

        location /aray/kol/angkol/con {
            proxy_pass http://127.0.0.1:20000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 60s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
            proxy_buffering off;
            proxy_cache off;
        }

        location / {
            return 200 '{"kind":"compute#project","id":"cloudrun-123","name":"cloudrun-demo","description":"Managed by Google Cloud Run","creationTimestamp":"2026-01-01T00:00:00Z"}';
            add_header Content-Type application/json;
            add_header Server "Google Frontend";
        }
    }
}
