worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 65535;
    use epoll;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # === OPTIMIZED FOR SPEED & STABILITY ===
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 4k;

    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    limit_req_zone $remote_addr zone=req_limit:10m rate=100r/s;
    limit_conn_zone $remote_addr zone=conn_limit:10m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;
        server_name _;

        # === TIMEOUTS — Long enough for streaming, fast enough to avoid hangs ===
        client_body_timeout 300s;
        client_header_timeout 300s;
        send_timeout 3600s;
        keepalive_timeout 7200s;

        # === BUFFERING — OFF for real-time smooth flow ===
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ =404;
        }

        # === TROJAN ===
        location /trojan-ws {
            limit_req zone=req_limit burst=100 nodelay;
            limit_conn conn_limit 100;
            proxy_redirect off;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 60s;
            proxy_send_timeout 86400s;
            proxy_read_timeout 86400s;
            proxy_pass http://127.0.0.1:10001;
        }

        location /trojan-hu {
            limit_req zone=req_limit burst=100 nodelay;
            limit_conn conn_limit 100;
            proxy_redirect off;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
