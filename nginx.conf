worker_processes auto;
events { 
    worker_connections 2048; 
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # --- CLOUD RUN REAL IP HANDLING ---
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # --- ANTI-DDOS / RATE LIMITING ---
    limit_req_zone $remote_addr zone=req_limit:10m rate=15r/s;
    limit_conn_zone $remote_addr zone=conn_limit:10m;

    server {
        listen 8080;
        server_name _;

        client_body_timeout 15s;
        client_header_timeout 15s;
        keepalive_timeout 65s;
        send_timeout 15s;

        # --- DECOY SITE ROOT ---
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ =404;
        }

        # --- VLESS WEBSOCKET PROXY ---
        location /vless-con {
            limit_req zone=req_limit burst=30 nodelay;
            limit_conn conn_limit 30;

            proxy_redirect off;
            proxy_pass http://127.0.0.1:10001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # --- TROJAN WEBSOCKET PROXY ---
        location /trojan-con {
            limit_req zone=req_limit burst=30 nodelay;
            limit_conn conn_limit 30;

            proxy_redirect off;
            proxy_pass http://127.0.0.1:10002;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
